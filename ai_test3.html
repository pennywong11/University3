<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 營養追蹤儀表板 (模擬模式)</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 使用 Inter 字體 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdfa; /* 淺綠色背景 */
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem;
        }
        #app {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px; /* 調整為單欄式較窄的寬度 */
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }
        /* 隱藏原生檔案輸入，僅顯示按鈕 */
        .file-label {
            display: block;
            cursor: pointer;
        }
        .file-input {
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
            position: absolute;
            z-index: -1;
        }
    </style>
    <!-- 載入 Font Awesome (用於圖標) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- 主儀表板視圖容器 -->
        <div id="mainDashboard" class="w-full space-y-8">
            <h1 class="text-4xl font-extrabold text-teal-700 text-center">AI 營養追蹤儀表板 <span class="text-2xl font-normal text-amber-500">(模擬模式)</span></h1>
            
            <!-- 狀態資訊 -->
            <div class="flex justify-between items-center text-sm text-gray-500 border-b pb-3">
                <span id="connectionStatus" class="font-medium text-amber-600">應用程式已啟動 (正在連線...)</span>
            </div>

            <!-- 分析區域 -->
            <div class="space-y-6">
                <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">1. 餐點 AI 分析</h2>

                <!-- 圖片輸入和分析按鈕 -->
                <div class="flex flex-col md:flex-row gap-4 items-center p-4 bg-gray-50 rounded-xl shadow-inner">
                    <label for="fileInput" class="file-label w-full md:w-auto flex-grow">
                        <div class="py-3 px-6 text-center text-sm font-semibold rounded-full border-2 border-teal-500 text-teal-700 bg-teal-50 hover:bg-teal-100 transition duration-200">
                            <i class="fas fa-camera mr-2"></i> 選擇餐點照片
                        </div>
                        <input type="file" id="fileInput" accept="image/*" class="file-input"/>
                    </label>

                    <!-- 按鈕容器，包含「取消選擇」和「開始模擬分析」 -->
                    <div class="flex flex-row gap-3 w-full md:w-auto">
                        <!-- 新增: 取消選擇按鈕 -->
                        <button 
                            id="clearSelectionBtn" 
                            disabled
                            class="py-3 px-6 text-sm font-semibold rounded-full shadow-md transition duration-200 
                            bg-gray-300 text-gray-700 hover:bg-gray-400 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[100px]"
                        >
                            取消選擇
                        </button>
                        
                        <!-- 既有: 分析按鈕 -->
                        <button 
                            id="analyzeButton" 
                            disabled
                            class="py-3 px-6 text-white font-bold rounded-full shadow-md transition duration-200 
                            bg-teal-600 hover:bg-teal-700 disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center min-w-[150px]"
                        >
                            <svg id="loadingIndicator" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            開始模擬分析
                        </button>
                    </div>
                </div>
                
                <!-- 圖片預覽 & 分析結果 -->
                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                    <div class="grid md:grid-cols-2 gap-6">
                        <!-- 圖片預覽 -->
                        <div class="relative bg-gray-100 rounded-lg overflow-hidden h-64 flex items-center justify-center">
                            <img id="imagePreview" src="" alt="餐點預覽" class="hidden max-h-full max-w-full object-cover">
                            <p id="placeholderText" class="text-gray-400">上傳圖片以開始分析</p>
                        </div>
                        
                        <!-- 分析結果 -->
                        <div>
                            <h3 class="text-xl font-semibold text-teal-600 mb-3">模擬 AI 分析報告</h3>
                            <div id="analysisResult" class="min-h-[14rem] space-y-4">
                                <p class="text-gray-500 italic">分析結果將顯示在這裡...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 訊息彈出視窗 (保留用於顯示錯誤或成功訊息) -->
        <div id="messageBox" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full">
                <h3 id="messageTitle" class="text-xl font-bold text-red-600 mb-3">通知</h3>
                <p id="messageContent" class="text-gray-700 mb-4">訊息內容</p>
                <!-- 訊息視窗中的確認按鈕，用於關閉通知 -->
                <button onclick="document.getElementById('messageBox').classList.add('hidden')" class="w-full py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600">確定</button>
            </div>
        </div>
    </div>

    <script type="module">
        // --- Firebase 相關變數 ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Firebase 核心服務導入 ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 核心服務實例 ---
        let db = null;
        let auth = null;
        let userId = null; // 用戶 ID 狀態

        // --- DOM 元素 ---
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderText = document.getElementById('placeholderText');
        const analyzeButton = document.getElementById('analyzeButton');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const analysisResult = document.getElementById('analysisResult');
        const connectionStatus = document.getElementById('connectionStatus');
        const clearSelectionBtn = document.getElementById('clearSelectionBtn'); // 新增: 清除選擇按鈕
        
        // --- 全域變數 ---
        const apiKey = ""; // API Key 保持為空
        let base64Image = null; // 儲存當前 Base64 圖片數據
        let currentAnalysisData = null; // 暫存分析結果

        // 模擬數據，當 API Key 不可用時使用
        const MOCK_MEAL_DATA = {
            dish_name: "模擬：烤雞肉與什錦蔬菜",
            calories: 520,
            protein_g: 45.0,
            fat_g: 22.5,
            carbs_g: 35.0,
            analysis_summary: "這是一份低碳水化合物、高蛋白的健康餐點。請注意脂肪主要來自於健康的油類。",
        };

        // --- 輔助函數：替代 alert() ---
        function showMessage(title, message, isError = true) {
            const messageBox = document.getElementById('messageBox');
            const messageTitle = document.getElementById('messageTitle');
            const messageContent = document.getElementById('messageContent');

            messageTitle.textContent = title;
            messageContent.textContent = message;
            
            // 動態調整顏色
            messageTitle.classList.toggle('text-red-600', isError);
            messageTitle.classList.toggle('text-teal-600', !isError);
            document.querySelector('#messageBox button').classList.toggle('bg-red-500', isError);
            document.querySelector('#messageBox button').classList.toggle('bg-teal-500', !isError);

            messageBox.classList.remove('hidden');
            messageBox.classList.add('flex');
        }

        /** 重置圖片預覽、分析結果和暫存數據 */
        function clearAnalysisState() {
            currentAnalysisData = null;
            base64Image = null;
            imagePreview.src = "";
            imagePreview.classList.add('hidden');
            placeholderText.classList.remove('hidden');
            analysisResult.innerHTML = `<p class="text-gray-500 italic">分析結果將顯示在這裡...</p>`;
            
            analyzeButton.disabled = true; 
            clearSelectionBtn.disabled = true; // 禁用清除按鈕
            
            fileInput.value = ''; // 清除檔案輸入框，允許重新選擇相同檔案
        }
        
        // --- 圖像處理 ---

        // 將圖片檔案轉換為 Base64 格式
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    // 提取 Base64 數據部分
                    const base64Data = reader.result.split(',')[1];
                    resolve(base64Data);
                };
                reader.onerror = error => reject(error);
            });
        }

        // 監聽檔案輸入
        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            
            clearAnalysisState(); // 清除之前的狀態和數據

            if (file) {
                // 圖片預覽
                imagePreview.src = URL.createObjectURL(file);
                imagePreview.classList.remove('hidden');
                placeholderText.classList.add('hidden');
                
                analyzeButton.disabled = false;
                clearSelectionBtn.disabled = false; // 啟用清除按鈕
                
                // 讀取 Base64
                try {
                    base64Image = await fileToBase64(file);
                } catch (error) {
                    showMessage("圖片錯誤", "無法讀取圖片檔案。", true);
                    clearAnalysisState();
                }
            }
        });
        
        // 監聽「取消選擇」按鈕
        clearSelectionBtn.addEventListener('click', () => {
            clearAnalysisState();
            showMessage("已清除", "已取消選擇照片，請重新上傳。", false);
        });

        // 模擬分析按鈕事件
        analyzeButton.addEventListener('click', async () => {
            if (!base64Image) return;

            analysisResult.innerHTML = `<div class="text-center py-8"><svg class="animate-spin h-8 w-8 text-teal-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="mt-2 text-teal-500">正在模擬 AI 分析餐點中...</p></div>`;
            analyzeButton.disabled = true;
            clearSelectionBtn.disabled = true; // 分析中禁用清除按鈕
            loadingIndicator.classList.remove('hidden');
            
            try {
                // 模擬 API 延遲 (2秒)
                await new Promise(resolve => setTimeout(resolve, 2000));

                // 使用模擬數據並附帶當前圖片 Base64 
                const mealData = { 
                    ...MOCK_MEAL_DATA, 
                    image_data: base64Image, 
                    timestamp: Date.now() 
                };
                
                // 儲存分析結果到暫存變數
                currentAnalysisData = mealData;

                // 顯示結果及儲存/取消按鈕
                showSaveActions(mealData); 
                // *** 移除分析成功後的彈出視窗，讓用戶看到結果後自行決定儲存/取消 ***
                
            } catch (error) {
                console.error("模擬分析發生錯誤:", error);
                analysisResult.innerHTML = `<p class="text-red-500 font-medium">模擬分析失敗：發生未知錯誤。</p>`;
                showMessage("模擬錯誤", `模擬分析失敗：${error.message || '請檢查控制台錯誤訊息'}`, true);
            } finally {
                // 在顯示儲存按鈕後，分析按鈕保持禁用，但啟用清除/取消按鈕
                loadingIndicator.classList.add('hidden');
                analyzeButton.disabled = true;
                clearSelectionBtn.disabled = false; 
            }
        });

        // --- 儲存/取消動作邏輯 ---

        async function confirmSave() {
            if (!currentAnalysisData) {
                showMessage("錯誤", "沒有可儲存的分析數據。", true);
                return;
            }

            try {
                const mealToSave = {
                    dish_name: currentAnalysisData.dish_name,
                    calories: currentAnalysisData.calories,
                    protein_g: currentAnalysisData.protein_g,
                    fat_g: currentAnalysisData.fat_g,
                    carbs_g: currentAnalysisData.carbs_g,
                    analysis_summary: currentAnalysisData.analysis_summary,
                    created_at: serverTimestamp(), 
                };

                // 模擬 Firestore 儲存 (如果 Firebase 已初始化)
                if (db && userId) {
                    // 實際 Firestore 儲存路徑: /artifacts/{appId}/users/{userId}/meals
                    const mealsCollection = collection(db, 'artifacts', appId, 'users', userId, 'meals');
                    // 模擬儲存過程中的加載狀態
                    analysisResult.innerHTML = `<div class="text-center py-8"><i class="fas fa-save animate-pulse text-teal-500 text-xl"></i><p class="mt-2 text-teal-500">正在儲存至資料庫...</p></div>`;

                    // 實際執行儲存 (圖片數據太大，只存摘要和數值)
                    await addDoc(mealsCollection, mealToSave);
                    showMessage("儲存成功", `餐點「${mealToSave.dish_name}」已成功記錄！`, false);
                } else {
                     // 模擬成功訊息 (如果 Firebase 未完全初始化)
                    analysisResult.innerHTML = `<div class="text-center py-8"><i class="fas fa-save text-teal-500 text-xl"></i><p class="mt-2 text-teal-500">模擬儲存成功！</p></div>`;
                    await new Promise(resolve => setTimeout(resolve, 500)); 
                    showMessage("模擬儲存成功", `餐點「${mealToSave.dish_name}」已成功模擬記錄。`, false);
                }
               
                // 成功後重置狀態
                clearAnalysisState();

            } catch (error) {
                console.error("儲存失敗:", error);
                showMessage("儲存失敗", `無法將數據儲存到資料庫: ${error.message || '請檢查控制台錯誤'}`, true);
                // 儲存失敗後，重置UI
                clearAnalysisState(); 
            }
        }

        function cancelSave() {
            showMessage("取消操作", "餐點分析結果已丟棄。", false);
            clearAnalysisState();
        }


        // 渲染分析結果到 UI (分析結果區塊) - 包含儲存按鈕
        function showSaveActions(data) {
            analysisResult.innerHTML = `
                <div class="space-y-3">
                    <h3 class="text-2xl font-bold text-teal-700">${data.dish_name || '未識別餐點'}</h3>
                    <div class="grid grid-cols-2 gap-2 text-sm font-medium">
                        <p class="bg-white p-2 rounded-lg shadow-sm">卡路里: <span class="text-red-500">${Math.round(data.calories || 0)} kcal</span></p>
                        <p class="bg-white p-2 rounded-lg shadow-sm">蛋白質: <span class="text-blue-500">${(data.protein_g || 0).toFixed(1)} g</span></p>
                        <p class="bg-white p-2 rounded-lg shadow-sm">脂肪: <span class="text-yellow-500">${(data.fat_g || 0).toFixed(1)} g</span></p>
                        <p class="bg-white p-2 rounded-lg shadow-sm">碳水化合物: <span class="text-green-500">${(data.carbs_g || 0).toFixed(1)} g</span></p>
                    </div>
                    <div class="pt-2">
                        <p class="font-semibold text-gray-700 mb-1">AI 營養總結：</p>
                        <p class="text-gray-600 italic text-sm">${data.analysis_summary || '無總結資訊。'}</p>
                    </div>
                </div>
                
                <!-- 確定儲存 / 取消 按鈕區塊 (由使用者點擊後才觸發訊息) -->
                <div id="saveActions" class="mt-6 pt-4 border-t border-gray-200 flex justify-end space-x-4">
                    <button id="cancelSaveBtn" class="py-2 px-4 text-sm font-semibold rounded-lg text-gray-700 bg-gray-200 hover:bg-gray-300 transition duration-150">
                        <i class="fas fa-times-circle mr-1"></i> 取消
                    </button>
                    <button id="confirmSaveBtn" class="py-2 px-4 text-sm font-bold rounded-lg text-white bg-teal-600 hover:bg-teal-700 transition duration-150 shadow-md">
                        <i class="fas fa-check-circle mr-1"></i> 確定儲存
                    </button>
                </div>
                
                <div class="text-sm text-center text-amber-500 pt-2 border-t mt-4">
                    <i class="fas fa-exclamation-triangle mr-1"></i> 目前使用模擬資料，實際分析需有效 API 金鑰。
                </div>
            `;
            // 設置按鈕事件監聽器
            document.getElementById('confirmSaveBtn').addEventListener('click', confirmSave);
            document.getElementById('cancelSaveBtn').addEventListener('click', cancelSave);
        }
        
        // --- Firebase 初始化 ---
        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser?.uid || crypto.randomUUID();
                console.log("Firebase initialized. User ID:", userId);
                connectionStatus.textContent = `已連線 (用戶 ID: ${userId.substring(0, 8)}...)`;

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                connectionStatus.textContent = '連線失敗 (使用模擬資料)';
            }
        }

        window.onload = () => {
             if (Object.keys(firebaseConfig).length > 0) {
                 initFirebase();
             } else {
                 connectionStatus.textContent = '應用程式已啟動 (使用模擬資料)';
             }
        };
    </script>
</body>
</html>
